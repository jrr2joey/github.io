<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081728">
<title>Captain Joe R. Rodriguez II | HMRT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="hmrt-icon-512.png">
<link rel="apple-touch-icon" href="hmrt-icon-512.png">
<style>
html,body{margin:0;background:#06111f;min-height:100%;font-family:Arial,Helvetica,sans-serif}
.page{min-height:100vh;display:grid;place-items:center;padding:10px;box-sizing:border-box}
.card{
  position:relative;
  width:min(100%,1536px);
  aspect-ratio:3/2;
  background:url('card.png') center/contain no-repeat;
}
.hotspot{
  position:absolute;
  display:block;
  border-radius:18px;
  text-decoration:none;
  -webkit-tap-highlight-color:rgba(239,202,91,.25);
  outline:none;
}
.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(239,202,91,.65)}
/* Button hotspots use percentages from the 1536x1024 card */
.call{left:2.45%;top:58.8%;width:22.4%;height:8.0%}
.email{left:25.7%;top:58.8%;width:20.6%;height:8.0%}
.teams{left:2.45%;top:67.8%;width:22.4%;height:8.4%}
.map{left:25.7%;top:67.8%;width:20.6%;height:8.4%}
.ios{left:2.45%;top:77.8%;width:22.4%;height:9.0%}
.android{left:25.7%;top:77.8%;width:20.6%;height:9.0%}
/* Make displayed contact details clickable too */
.city-detail{left:55.3%;top:58.4%;width:21.0%;height:7.0%}
.personal-detail{left:55.3%;top:66.4%;width:21.0%;height:7.0%}
.email-detail{left:55.3%;top:74.5%;width:21.0%;height:7.0%}
.admin-detail{left:55.3%;top:82.3%;width:21.0%;height:6.5%}
@media (max-width:700px){
  .page{padding:0;align-items:start}
  .card{width:100%;margin-top:4px}
  .hotspot{border-radius:10px}
}

.qr-hotspot{left:79.3%;top:55.8%;width:20.2%;height:34.0%;z-index:5}

</style>
</head>
<body>
<main class="page">
  <section class="card" aria-label="Captain Joe R. Rodriguez II digital business card">

    <a class="hotspot call" href="tel:+17139077714" aria-label="Call city cell"></a>
    <a class="hotspot email" href="mailto:Joe.Rodriguez2@HoustonTX.Gov" aria-label="Email Joe Rodriguez"></a>
    <a class="hotspot teams" href="https://teams.microsoft.com/l/chat/0/0?users=Joe.Rodriguez2@HoustonTX.Gov" aria-label="Open Microsoft Teams chat"></a>
    <a class="hotspot map" href="https://www.google.com/maps/search/?api=1&query=7825+Harrisburg+Blvd+Houston+TX+77012" aria-label="Open Admin location in Maps"></a>

    <a class="hotspot ios" href="captainjoerodriguez.vcf" download aria-label="Save contact on iPhone"></a>
    <a class="hotspot android" href="captainjoerodriguez.vcf" download aria-label="Save contact on Android"></a>

    <a class="hotspot city-detail" href="tel:+17139077714" aria-label="Call city cell"></a>
    <a class="hotspot personal-detail" href="tel:+17135396005" aria-label="Call personal cell"></a>
    <a class="hotspot email-detail" href="mailto:Joe.Rodriguez2@HoustonTX.Gov" aria-label="Email Joe Rodriguez"></a>
    <a class="hotspot admin-detail" href="https://www.google.com/maps/search/?api=1&query=7825+Harrisburg+Blvd+Houston+TX+77012" aria-label="Open Admin location in Maps"></a>

    <a class="hotspot qr-hotspot" href="https://houtx.sharepoint.com/sites/hfd/er/hm" aria-label="Open HMRT Team Home"></a>

  </section>
</main>
</body>
</html>
